name: Import Unity 2022 Project

on:
  push:
    paths:
      - ".github/workflows/import-unity2022.yml"
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone prepared Unity 2022 source
        run: |
          git clone --depth 1 --branch unity-2022.3.62f2-migration \
            https://github.com/pure-alone/Dewy-Water-Journey-Unity.git /tmp/dewy-source

      - name: Copy complete project
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/dewy-source/ ./
          rm -f .init

      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: import complete Unity 2022.3.62f2 project"
            git push origin HEAD:main
          fi
